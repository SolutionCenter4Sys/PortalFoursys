name: portalfoursys-v2

services:

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-redisdev}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"          # expõe localmente para seed scripts (remova em prod)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisdev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Jarvis (Next.js backend de voz) ─────────────────────────────────────────
  jarvis:
    build:
      context: ./jarvis
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker          # copie de .env.docker.example e preencha
    environment:
      # Sobrescreve REDIS_URL para apontar para o container interno
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redisdev}@redis:6379"
      NODE_ENV: production
    ports:
      - "3000:3000"          # expõe localmente para debug (opcional)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Portal (Vite SPA + nginx proxy) ─────────────────────────────────────────
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      jarvis:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
