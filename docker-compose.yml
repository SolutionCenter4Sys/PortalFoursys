name: portalfoursys-v2

services:

  # ── PostgreSQL + pgvector (banco local) ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17        # PostgreSQL 17 com pgvector pré-instalado
    restart: unless-stopped
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-jarvis}"
      POSTGRES_USER:     "${POSTGRES_USER:-jarvis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-jarvisdev}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema aplicado automaticamente na primeira inicialização do volume
      - ./jarvis/supabase/migrations/000_jarvis_v2_clean_rag.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro
    ports:
      - "5432:5432"          # expõe localmente para pgAdmin / seed scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-redisdev}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"          # expõe localmente para seed scripts (remova em prod)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisdev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Jarvis (Next.js backend de voz) ──────────────────────────────────────────
  jarvis:
    build:
      context: ./jarvis
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_VOICE_MIC_REARM_MS: ${NEXT_PUBLIC_VOICE_MIC_REARM_MS:-350}
        NEXT_PUBLIC_VAD_POSITIVE_THRESHOLD: ${NEXT_PUBLIC_VAD_POSITIVE_THRESHOLD:-0.7}
        NEXT_PUBLIC_VAD_MIN_SPEECH_MS: ${NEXT_PUBLIC_VAD_MIN_SPEECH_MS:-250}
        NEXT_PUBLIC_VOICE_MIN_UTTERANCE_MS: ${NEXT_PUBLIC_VOICE_MIN_UTTERANCE_MS:-600}
        NEXT_PUBLIC_VAD_REDEMPTION_MS: ${NEXT_PUBLIC_VAD_REDEMPTION_MS:-1600}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker          # copie de .env.docker.example e preencha
    environment:
      NODE_ENV:   production
      # URLs internas (sobrescrevem .env.docker para apontar aos containers)
      DATABASE_URL: "postgresql://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:-jarvisdev}@postgres:5432/${POSTGRES_DB:-jarvis}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD:-redisdev}@redis:6379"
    ports:
      - "3000:3000"          # expõe localmente para debug (opcional)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Portal (Vite SPA + nginx proxy) ──────────────────────────────────────────
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      jarvis:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
