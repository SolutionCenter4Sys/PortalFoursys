server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome → cache longo
    location ~* \.(js|css|png|svg|ico|woff2|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy Jarvis: rotas que o SPA precisa mas servem do backend
    location /api/ {
        proxy_pass         http://jarvis:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        # SSE / NDJSON streaming — desabilita buffer para TTFA
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    location /embed {
        proxy_pass         http://jarvis:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    location /vad/ {
        proxy_pass         http://jarvis:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_buffering    off;
    }

    location /_next/ {
        proxy_pass         http://jarvis:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # SPA fallback — React Router / client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
